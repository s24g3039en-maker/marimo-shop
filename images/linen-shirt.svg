    <!-- Shirt Body -->
    <path d="M145 118 L100 160 L125 185 L150 165 L150 310 C150 315 155 320 160 320 L240 320 C245 320 250 315 250 310 L250 165 L275 185 L300 160 L255 118 C240 135 220 142 200 142 C180 142 160 135 145 118 Z" fill="#FDFBF7" stroke="#E2DCD5" stroke-width="2" />
    
